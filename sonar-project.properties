# ── SonarCloud configuration for Todo API ────────────────────────────────────
# SonarCloud is the cloud-hosted version of SonarQube (free for public repos)
# Sign up at https://sonarcloud.io using your GitHub account

# REQUIRED: Replace these two values with your own from SonarCloud
# Found at: sonarcloud.io → your project → Information (bottom left)
sonar.organization=GurnooorSinghBhatia
sonar.projectKey=gurnooorsinghbhatia

# Project info
sonar.projectName=Todo API - SIT753
sonar.projectVersion=1.0

# Where your source and test code live
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage report path (generated by: npm test -- --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,*.tar.gz,*.log
sonar.test.exclusions=node_modules/**

# SonarCloud host (not localhost — this is the cloud service)
sonar.host.url=https://sonarcloud.io

# Wait for quality gate result before pipeline continues
sonar.qualitygate.wait=true
