# SonarQube configuration for Todo API
# Requires SonarQube server running at localhost:9000
# Download Community Edition: https://www.sonarsource.com/products/sonarqube/downloads/

sonar.projectKey=todo-api
sonar.projectName=Todo API - SIT753
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage report (generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-reporter.xml

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,*.tar.gz
sonar.test.exclusions=node_modules/**

# Quality Gate - fail pipeline if gate fails
sonar.qualitygate.wait=true
